# Builds the Android app after every change on main and publishes the APK as a GitHub release.
# The release tag build-<number> is what the "update available" banner in the app looks for
# (smart-shopping/src/native/update.tsx).
name: Android build

on:
  push:
    branches: [main]
    paths:
      - "smart-shopping/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      test_ads:
        description: "Test build: Google's test ads, nothing published (APK in the run's artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-shopping
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
      # AdMob (src/ads.ts), set under Settings → Secrets and variables → Actions → Variables.
      # Real ads go only into the Google Play bundle: the APK on GitHub is what the developer
      # installs, and an AdMob account must never see its owner's impressions or clicks. The
      # GitHub APK has no ads; a test build (test_ads) shows Google's test ads.
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
      ADMOB_TESTING: ${{ inputs.test_ads && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: smart-shopping/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - run: npm run check:runtime

      # Push notifications (src/push.ts) need the Firebase project's google-services.json, kept in
      # the secret GOOGLE_SERVICES_JSON (the file itself, or the file in base64). Without it the
      # app is built without push notifications.
      - name: Add the Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::Secret GOOGLE_SERVICES_JSON is not set: no push notifications in this build"
            exit 0
          fi
          case "$GOOGLE_SERVICES_JSON" in
            "{"*) printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json ;;
            *) printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json ;;
          esac
          echo "PUSH_ENABLED=1" >> "$GITHUB_ENV"

      - name: Build the web bundle and sync it into the Android project
        env:
          ADMOB_BANNER_ID: ${{ inputs.test_ads && vars.ADMOB_BANNER_ID || '' }}
        run: npm run build:android

      # Every build must be signed with the same key, or Android refuses to install it over
      # the previous one.
      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: smart-shopping/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/korzina.apk"

      # The same app for Google Play: an App Bundle, without the self-update banner that Play's
      # rules forbid. Play Console takes it from the run's artifacts.
      # A test build is for looking at the app: it is not released anywhere.
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.test_ads }}
        with:
          name: korzina-test-ads-${{ github.run_number }}
          path: ${{ runner.temp }}/korzina.apk
          retention-days: 30

      - name: Build the Google Play bundle
        if: ${{ !inputs.test_ads }}
        env:
          APP_STORE: play
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          npm run build:android
          cd android
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/korzina-play-${APP_VERSION_CODE}.aab"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.test_ads }}
        with:
          name: korzina-play-${{ github.run_number }}
          path: ${{ runner.temp }}/korzina-play-${{ github.run_number }}.aab
          retention-days: 90

      - name: Publish the release
        if: ${{ !inputs.test_ads }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          gh release create "build-$APP_VERSION_CODE" "$RUNNER_TEMP/korzina.apk" \
            --target "$GITHUB_SHA" \
            --title "Корзина $APP_VERSION_NAME" \
            --notes "$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)" \
            --latest
