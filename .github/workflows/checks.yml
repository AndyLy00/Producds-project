# Type check and tests on every push and pull request. The server tests (tests/api.test.mjs)
# run against a throwaway MongoDB started as a service container.
name: Checks

on:
  push:
    branches: [main]
    paths:
      - "smart-shopping/**"
      - ".github/workflows/checks.yml"
  pull_request:
    paths:
      - "smart-shopping/**"
      - ".github/workflows/checks.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-shopping
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: smart-shopping/package-lock.json

      - run: npm ci

      - run: npm run check:runtime

      - name: Type check
        run: npx tsc --noEmit

      - name: Server and merge tests
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: npm run test:api
